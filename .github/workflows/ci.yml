name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches backend/package.json's engines field -- node:sqlite (this
          # app's zero-native-deps database layer) needs 22.5+.
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run test suite
        working-directory: backend
        run: npm test

      # Informational only (never fails the build) -- surfaces known
      # dependency vulnerabilities in the Actions log without blocking
      # merges on issues that may be pre-existing/unrelated to this change.
      # A real fix or an accepted-risk decision is a separate, deliberate
      # action, not something CI should silently gate on.
      - name: Dependency audit (informational)
        if: always()
        working-directory: backend
        run: npm audit --audit-level=high || true

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # devDependencies included -- vite itself lives there, and
        # NODE_ENV=production would otherwise prune it away. The deploy
        # workflow needs the same flag for the same reason.
        working-directory: frontend
        run: npm ci --include=dev

      - name: Build
        working-directory: frontend
        run: npm run build
